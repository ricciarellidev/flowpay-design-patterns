services:
  flowpay:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FLOWPAY_MAX_AMOUNT: "100000.00"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

